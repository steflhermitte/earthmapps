<script>
  document.querySelectorAll('a[href^="http://"], a[href^="https://"]').forEach(function(link) {
    if (link.hostname !== window.location.hostname) {
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    }
  });

  var publicationIcons = {
    PDF: 'fa-cloud-download',
    Publisher: 'fa-home',
    Code: 'fa-github',
    Story: 'fa-desktop'
  };

  document.querySelectorAll('.publication-table-wrapper a').forEach(function(link) {
    var label = link.textContent.trim();
    var icon = publicationIcons[label];

    if (icon) {
      link.classList.add('icon', icon);
      link.title = label;
      link.setAttribute('aria-label', label);
      link.textContent = '';
    }
  });
</script>
